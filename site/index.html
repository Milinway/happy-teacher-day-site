<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Teacher Day</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage">
    <section class="scene center" id="s1"><p class="line"></p></section>
    <section class="scene center" id="s2"><p class="line"></p></section>

    <section class="scene center" id="s3">
      <p class="line"></p>
      <svg id="cal" viewBox="0 0 200 200" hidden aria-hidden="true">
        <rect x="20" y="30" width="160" height="150" rx="14" fill="#fff" stroke="#e5484d" stroke-width="6"/>
        <rect x="20" y="30" width="160" height="34" rx="14" fill="#e5484d"/>
        <rect x="55" y="18" width="10" height="26" rx="5" fill="#555"/><rect x="135" y="18" width="10" height="26" rx="5" fill="#555"/>
        <g id="cells" fill="#cfd8ff"></g>
        <g id="lens"><circle r="16" fill="#ffffff55" stroke="#f0a020" stroke-width="5"/><line x1="11" y1="11" x2="28" y2="28" stroke="#f0a020" stroke-width="6" stroke-linecap="round"/></g>
        <path id="tick" d="M60 125 l22 22 l50 -56" fill="none" stroke="#1ea34a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
      </svg>
    </section>

    <section class="scene center" id="s4">
      <p class="line"></p>
      <p class="big hl" hidden>“HARI GURU 🥳”</p>
    </section>

    <section class="scene center" id="s5"><p class="line wide"></p></section>

    <section class="scene" id="s6">
      <div class="marquee"><div class="marquee-track" id="collage"></div></div>
      <img class="hero" src="img/hero.png" alt="Ustad Raihan">
    </section>

    <section class="scene split" id="s7">
      <div class="photo"></div>
      <div class="panel">
        <p class="eyebrow">PENCAPAIAN</p>
        <h2 class="title">How cool is he?</h2>
        <div class="ringwrap"><img src="img/top24.jpg" alt="Top 24 DBL Super Teacher"><i class="ring"></i></div>
        <p class="note">dengan menjadi top 24 dbl super teacher aja udah nunjukin betapa kerennya guru ini</p>
      </div>
    </section>

    <section class="scene split" id="s8">
      <div class="photo">
        <div class="photo-slideshow" aria-hidden="true">
          <img src="img/p-gold.jpg" alt="">
          <img src="img/p-group.jpg" alt="">
          <img src="img/p-gamefy.jpg" alt="">
          <img src="img/p-juara.jpg" alt="">
        </div>
      </div>
      <div class="panel">
        <p class="eyebrow">MOMEN BERKESAN</p>
        <div class="polaroids">
          <img src="img/p-gold.jpg" alt="" style="--i:0;--r:-2deg"><img src="img/p-juara.jpg" alt="" style="--i:1;--r:1.5deg"><img src="img/p-cert.jpg" alt="" style="--i:2;--r:-1deg">
          <img src="img/p-gamefy.jpg" alt="" style="--i:3;--r:2deg"><img src="img/p-group.jpg" alt="" style="--i:4;--r:-1.5deg"><img src="img/p-summit.jpg" alt="" style="--i:5;--r:1deg">
        </div>
        <p class="note">dan banyaknya prestasi hingga guru pendamping yang membawa sebuah pengalaman paling berkesan</p>
      </div>
    </section>

    <section class="scene split" id="s9">
      <div class="photo"></div>
      <div class="panel">
        <p class="eyebrow">SEBUAH PESAN</p>
        <p class="para"></p>
        <span class="signature">— Syamil</span>
      </div>
    </section>

    <section class="scene" id="s10">
      <div class="rain-text" id="rt"></div>
      <img class="hero" src="img/hero.png" alt="Ustad Raihan">
    </section>
  </main>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="flash" aria-hidden="true"></div>
  <button id="audio-toggle" hidden aria-label="Toggle music" aria-pressed="false">♪</button>
  <button id="next-scene" type="button" aria-label="Lanjut ke scene berikutnya">Lanjut <span aria-hidden="true">→</span></button>
  <button id="restart-site" type="button" aria-label="Ulangi website" hidden>Ulangi <span aria-hidden="true">↻</span></button>

  <script src="js/engine.js"></script>
  <script src="js/scenes.js"></script>
</body>
</html>
